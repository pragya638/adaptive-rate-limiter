spring:
  application:
    name: adaptive-rate-limiter
  task:
    scheduling:
      pool:
        size: 2          # monitoring and adaptive evaluation must not block each other
      thread-name-prefix: adaptive-sched-
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: 8080

# Static (Phase 1) rate limiter configuration
rate-limit:
  enabled: true
  store: memory          # memory (default) or redis
  max-requests: 5        # allowed requests per client per window
  window: 30s            # length of the fixed window (ISO-8601 duration)
  include-paths:         # paths that are rate limited
    - /api/**
  exclude-paths:         # paths that bypass the limiter
    - /api/health
    - /api/metrics
    - /api/adaptive/status
    - /api/system-status
    - /api/history
  client-id-header: X-Client-Id   # falls back to caller IP when absent
  redis:
    key-prefix: rl                # all keys start with this prefix
    ttl-grace: 30s                # extra TTL beyond the window
    failure-mode: open            # open = local fallback; closed = reject while Redis is down
    failure-log-interval-seconds: 30

# Phase 3: Traffic monitoring and EWMA (tunable)
monitoring:
  ewma-alpha: 0.3        # 0 < alpha <= 1
  observation-interval: 30s

# Bounded dashboard history. In-memory only: survives page reloads while the
# backend runs, but resets when the backend restarts.
dashboard-history:
  max-records: 120       # per series: traffic, anomalies, decisions, limits



ml-service:
  base-url: http://localhost:8000
  connect-timeout-ms: 1000
  read-timeout-ms: 1000

adaptive:
  enabled: false
  cooldown-seconds: 10
  evaluation-lock-ttl-seconds: 60   # Redis leader-lock TTL; must exceed one evaluation

# Phase 5: adaptive decision engine bounds (used when adaptive.enabled=true)
adaptive-rate-limiter:
  min-limit: 1
  max-limit: 1000
  initial-limit: 5       # starts at the same value as rate-limit.max-requests
  increase-step: 10
  decrease-step: 10      # absolute cap on a single decrease
  decrease-fraction: 0.2 # relative cap: a single decrease removes at most 20%
  recovery-step: 1       # gradual recovery increment after normal windows
  recovery-windows: 3    # consecutive normal windows before recovery starts
  anomaly-confirmation-windows: 2  # consecutive anomalies before a decrease
  growth-confirmation-windows: 2   # consecutive growth windows before an increase
  # anomaly-score-threshold: 0.5   # optional Isolation Forest score gate (unset = disabled)
  # growth-ceiling: 500            # optional soft growth cap (unset = max-limit)
  # anomaly-require-corroboration: false
  # spike-requires-corroboration: false
